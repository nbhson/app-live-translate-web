name: ci
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pnpm install
      - run: pnpm run typecheck
      - run: npx eslint packages/shared/src apps/web/lib --ext .ts,.tsx
      - run: pip install ruff
      - run: ruff check apps/server/src
      - run: ruff format --check apps/server/src
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pnpm install
      - run: pnpm --filter @live-translate/shared run test:coverage
      - run: pnpm --filter web run test:coverage
      - run: pip install -r apps/server/requirements.txt
      - run: python -m pytest apps/server/tests --cov=src --cov-report=term --cov-fail-under=90
      - run: pnpm run build

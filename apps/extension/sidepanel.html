<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Live Translate</title><link rel="stylesheet" href="sidepanel.css"></head><body>
<header class="app-header"><div class="brand"><div class="logo-dot"></div><div class="title-area"><h1>Live Translate</h1><span class="subtitle">Tab Audio → Free</span></div></div><div class="controls"><select id="audioSourceSelect" class="btn-icon-wide"><option value="tab">🌐 Tab (incl. iframe)</option><option value="mic">🎙️ Microphone</option></select><button id="toggleBtn" class="btn btn-primary"><span id="playIcon">▶</span><span id="stopIcon" style="display:none">■</span><span id="btnText">Start</span></button></div></header>
<main class="recording-layout">
  <div id="idleState" class="idle-state"><div class="idle-icon">🎙️</div><p>Click Start to capture tab audio</p><span>Works for iframe video in current tab</span></div>
  <div id="recordingIndicator" class="recording-indicator hidden"><div class="pulse-wrap"><div class="pulse-ring"></div><div class="pulse-dot"></div></div><p class="recording-text">Recording audio...</p><div class="waveform"><span></span><span></span><span></span><span></span><span></span></div><div class="live-text" id="liveText"></div></div>
</main>
<footer class="app-footer"><div id="statusText">Ready — select Tab to include iframe</div><button id="clearBtn" class="btn btn-ghost">Clear</button></footer>
<div class="overlay" id="permissionOverlay" style="display:none"><div class="overlay-card"><h3>Microphone permission required</h3><button id="grantPermissionBtn" class="btn btn-primary">Grant</button></div></div>
<script src="sidepanel.js"></script></body></html>

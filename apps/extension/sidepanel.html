<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Live Translate</title><link rel="stylesheet" href="sidepanel.css"></head><body>
<header class="app-header"><div class="brand"><div class="logo-dot"></div><div class="title-area"><h1>Live Translate</h1><span class="subtitle">Tab Audio ➜ Web Speech FREE</span></div></div><div class="controls"><select id="audioSourceSelect" class="btn-icon-wide"><option value="tab">🌐 Âm thanh Tab (kể cả iframe)</option><option value="mic">🎙️ Microphone</option></select><button id="toggleBtn" class="btn btn-primary"><span id="playIcon">▶</span><span id="stopIcon" style="display:none">■</span><span id="btnText">Bắt đầu</span></button><button id="clearBtn" class="btn btn-icon">🗑️</button></div></header>
<main class="split-layout"><section class="panel-section"><div class="panel-header">🇬🇧 English</div><div class="panel-content scrollable" id="englishContent"><div class="placeholder-text" id="enPlaceholder">Nhấp Bắt đầu, phát audio trong tab/iframe...</div><div class="transcript-log" id="englishLog"></div><div class="interim-text" id="englishInterim"></div></div></section><div class="glow-divider"></div><section class="panel-section"><div class="panel-header">🇻🇳 Tiếng Việt</div><div class="panel-content scrollable" id="vietnameseContent"><div class="placeholder-text" id="viPlaceholder">Bản dịch sẽ hiện ở đây...</div><div class="transcript-log" id="vietnameseLog"></div><div class="interim-text" id="vietnameseInterim"></div></div></section></main>
<footer class="app-footer"><div id="statusText">Sẵn sàng - Chọn Tab để bắt cả iframe</div><label><input type="checkbox" id="autoScrollCheck" checked> Tự động cuộn</label></footer>
<div class="overlay" id="permissionOverlay" style="display:none"><div class="overlay-card"><h3>Cần quyền Microphone</h3><button id="grantPermissionBtn" class="btn btn-primary">Cấp quyền</button></div></div>
<script src="sidepanel.js"></script></body></html>

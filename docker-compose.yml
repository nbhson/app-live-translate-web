services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: live
      POSTGRES_PASSWORD: live
      POSTGRES_DB: live_translate
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U live"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redisdata:/data]

  server:
    build: ../apps/server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://live:live@postgres:5432/live_translate
      REDIS_URL: redis://redis:6379
      STT_PROVIDER: ${STT_PROVIDER:-deepgram}
      TRANSLATE_PROVIDER: ${TRANSLATE_PROVIDER:-auto}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:?Set in .env}
      CUSTOM_API_KEY: ${CUSTOM_API_KEY:-}
      CUSTOM_BASE_URL: ${CUSTOM_BASE_URL:-}
      CUSTOM_MODEL: ${CUSTOM_MODEL:-}
    ports: ["8000:8000"]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
